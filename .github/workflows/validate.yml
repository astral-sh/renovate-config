name: Validate Renovate presets

on:
  pull_request:
    paths:
      - "default.json"
      - "preset.json5"
      - ".github/workflows/validate.yml"
  workflow_dispatch:

permissions: {}

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: renovate/renovate:43.264.2@sha256:062bec49857f0b23232e09fc9a557b3abf71dd499dbf54c2137a83d9c6320795

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Validate repository-level Renovate presets
        run: |
          for config in default.json preset.json5; do
            renovate-config-validator --strict --no-global "$config"
          done
